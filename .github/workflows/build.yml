name: Build installers

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . pyinstaller
      - name: Build exe
        run: >
          pyinstaller --noconfirm --clean --windowed --onefile --name DanteLUFS
          --collect-all sounddevice --collect-all _sounddevice_data
          --exclude-module PySide6.QtQml --exclude-module PySide6.QtQuick
          --exclude-module PySide6.QtWebEngineCore --exclude-module PySide6.QtNetwork
          --exclude-module PySide6.QtOpenGL run.py
      - uses: actions/upload-artifact@v4
        with:
          name: DanteLUFS-windows
          path: dist/DanteLUFS.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . pyinstaller
      - name: Build app bundle
        run: >
          pyinstaller --noconfirm --clean --windowed --name "Dante LUFS"
          --osx-bundle-identifier com.dantelufs.meter
          --collect-all sounddevice --collect-all _sounddevice_data
          --exclude-module PySide6.QtQml --exclude-module PySide6.QtQuick
          --exclude-module PySide6.QtWebEngineCore --exclude-module PySide6.QtNetwork
          --exclude-module PySide6.QtOpenGL run.py
      - name: Add microphone usage description
        run: >
          plutil -insert NSMicrophoneUsageDescription
          -string "Dante LUFS needs audio input access to meter loudness."
          "dist/Dante LUFS.app/Contents/Info.plist"
      - name: Ad-hoc sign and build DMG
        run: |
          codesign --force --deep --sign - "dist/Dante LUFS.app"
          mkdir -p dmg
          cp -R "dist/Dante LUFS.app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Dante LUFS" -srcfolder dmg -ov -format UDZO "dist/DanteLUFS.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: DanteLUFS-macos
          path: dist/DanteLUFS.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/DanteLUFS-windows/DanteLUFS.exe
            artifacts/DanteLUFS-macos/DanteLUFS.dmg
