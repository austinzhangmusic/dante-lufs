[project]
name = "dante-lufs"
version = "0.2.0"
description = "Cross-platform stereo LUFS-I meter (Core Audio / ASIO) styled after the TC Electronic Clarity M"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "sounddevice>=0.5",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest", "pyinstaller"]

[project.scripts]
dante-lufs = "dante_lufs.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dante_lufs*"]
